name: Validate Payroll Queue

on:
  push:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - scripts/githubApi.js
      - scripts/payroll.js
      - scripts/processMergedBounty.js
      - scripts/processTestingBounty.js
      - scripts/settlePayroll.js
      - scripts/validatePayrollQueue.js
      - test/payroll.test.js
      - .github/workflows/bounty-bot.yml
      - .github/workflows/testing-bounty.yml
      - .github/workflows/settle-payroll.yml
      - .github/workflows/validate-payroll-queue.yml
  pull_request:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - scripts/githubApi.js
      - scripts/payroll.js
      - scripts/processMergedBounty.js
      - scripts/processTestingBounty.js
      - scripts/settlePayroll.js
      - scripts/validatePayrollQueue.js
      - test/payroll.test.js
      - .github/workflows/bounty-bot.yml
      - .github/workflows/testing-bounty.yml
      - .github/workflows/settle-payroll.yml
      - .github/workflows/validate-payroll-queue.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Validate payroll queue
        run: node scripts/validatePayrollQueue.js

      - name: Test payroll automation
        run: node --test test/payroll.test.js
