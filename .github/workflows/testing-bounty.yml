name: Testing Bounty Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  handle-command:
    if: >
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, '/test-complete') || startsWith(github.event.comment.body, '/test-approved'))
    runs-on: ubuntu-latest
    concurrency:
      group: artfi-payroll-queue
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Process testing bounty command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/processTestingBounty.js

      - name: Validate updated queue
        run: node scripts/validatePayrollQueue.js

      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          git commit -m "chore: queue testing bounty payout"
          git pull --rebase origin main
          git push origin HEAD:main
