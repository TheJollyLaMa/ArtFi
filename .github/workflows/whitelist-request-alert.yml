name: Whitelist request alert

on:
  issues:
    types: [opened]

jobs:
  notify-admin:
    if: contains(github.event.issue.labels.*.name, 'whitelist-request')
    runs-on: ubuntu-latest
    steps:
      - name: Send admin email
        uses: actions/github-script@v7
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WHITELIST_REQUEST_TO: ${{ secrets.WHITELIST_REQUEST_TO }}
        with:
          script: |
            const nodemailer = require('nodemailer');
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name).join(', ');
            const body = issue.body || '';
            const lines = body.split(/\r?\n/);
            const form = {};
            for (const line of lines) {
              const match = line.match(/^[-*]?\s*[-:]?\s*(.+?):\s*(.*)$/);
              if (!match) continue;
              form[match[1].trim()] = match[2].trim();
            }

            const githubUser = form['GitHub username'] || '@unknown';
            const email = form['Email for follow-up'] || 'not provided';
            const wallet = form['Wallet address'] || 'not provided';
            const role = form['Desired role'] || 'not provided';
            const summary = form['Contribution summary'] || 'not provided';

            const transporter = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: Number(process.env.SMTP_PORT || 587),
              secure: Number(process.env.SMTP_PORT || 587) === 465,
              auth: {
                user: process.env.SMTP_USER,
                pass: process.env.SMTP_PASS,
              },
            });

            const mailText = [
              'ArtFi whitelist request received.',
              '',
              `Issue: #${issue.number}`,
              `Title: ${issue.title}`,
              `Labels: ${labels}`,
              '',
              `GitHub username: ${githubUser}`,
              `Email for follow-up: ${email}`,
              `Wallet address: ${wallet}`,
              `Desired role: ${role}`,
              `Contribution summary: ${summary}`,
              '',
              `View issue: ${issue.html_url}`,
            ].join('\n');

            await transporter.sendMail({
              from: process.env.SMTP_FROM,
              to: process.env.WHITELIST_REQUEST_TO,
              subject: `ArtFi whitelist request: ${issue.title}`,
              text: mailText,
            });

            core.info(`Whitelist request email sent for issue #${issue.number}`);
