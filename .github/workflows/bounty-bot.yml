name: Bounty Bot

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed or merged PR number to recover
        required: true
        type: string
      issue_number:
        description: Optional issue number(s), comma-separated when the PR is not linked correctly
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  queue-bounty:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: artfi-payroll-queue
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Queue merged PR payout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: node scripts/processMergedBounty.js

      - name: Validate updated queue
        run: node scripts/validatePayrollQueue.js

      - name: Commit queue update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          git commit -m "chore: queue payroll entries from merged PR"
          git pull --rebase origin main
          git push origin HEAD:main
