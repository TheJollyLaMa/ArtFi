name: Deploy ArtFi Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - Artizen_LOGO.png
      - Ens_Eth_Breathe.gif
      - metamask.png
      - IPFS_Logo.png
      - payroll-queue.json
      - scripts/ucanStorage.mjs
      - .github/workflows/deploy-pages.yml
      - docs/PAGES.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir -p _site/scripts
          cp index.html Artizen_LOGO.png Ens_Eth_Breathe.gif metamask.png IPFS_Logo.png payroll-queue.json _site/
          cp scripts/ucanStorage.mjs _site/scripts/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4