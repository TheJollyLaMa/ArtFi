name: Contributor Request
description: Request to contribute to ArtFi as a technically savvy builder or tester
title: "Contributor request: "
labels: ["contributor-request"]
body:
  - type: markdown
    attributes:
      value: |
        We are looking for technically savvy contributors for repo work, tooling, frontend improvements, testing, and protocol experiments.

        Please keep it brief and technical. No interview, bio, or long background summary is required.

  - type: input
    id: github
    attributes:
      label: GitHub username
      description: Your GitHub handle
      placeholder: e.g. yourname
    validations:
      required: true

  - type: input
    id: wallet
    attributes:
      label: Wallet address
      description: Ethereum wallet address for ART payouts
      placeholder: 0x...
    validations:
      required: true

  - type: textarea
    id: skills
    attributes:
      label: What you want to help with
      description: Tell us the technical area or task you want to contribute to.
      placeholder: Frontend, smart contracts, backend, tooling, testing, research, etc.
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Relevant links / repos / past work
      description: Share any relevant projects, repos, or portfolio links.
      placeholder: https://github.com/yourname/project
    validations:
      required: false
